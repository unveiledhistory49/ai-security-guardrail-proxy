# AI Security Guardrail Proxy Configuration
host: "0.0.0.0"
port: 8080
upstream_url: "http://localhost:11434"
max_payload_bytes: 4194304

timeouts:
  read_timeout_ms: 15000
  write_timeout_ms: 60000
  idle_timeout_ms: 90000
  upstream_timeout_ms: 60000

audit:
  log_path: "/var/log/guardrail/audit.log"
  buffer_capacity: 65536
  hmac_key: "production-secret-hmac-audit-key-do-not-share"

circuit_breaker:
  failure_threshold: 5
  cooldown_seconds: 30
  half_open_probes: 2

tenants:
  - api_key: "sk-guard-prod-alpha-secret-key-1"
    tenant_id: "tenant-alpha"
    name: "Engineering Core Team"
    enabled: true
    rate_limits:
      requests_per_minute: 120
      tokens_per_minute: 500000

  - api_key: "sk-guard-prod-beta-secret-key-2"
    tenant_id: "tenant-beta"
    name: "Internal Customer Support"
    enabled: true
    rate_limits:
      requests_per_minute: 60
      tokens_per_minute: 250000
